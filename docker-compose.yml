version: '3.3'

services:
  github-runner:
    build: .
    image: github-runner:latest
    container_name: github-runner 
    environment:
        - ORGANIZATION=${ORGANIZATION}
        - ACCESS_TOKEN=${ACCESS_TOKEN}
        - TZ=America/Los_Angeles
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /opt:/opt
